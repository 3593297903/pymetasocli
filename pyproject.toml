[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "metasocli-py"
version = "0.1.0"
description = "Independent Python story, image and Metaso H3 task CLI"
requires-python = ">=3.13,<3.15"
dependencies = [
  "pydantic>=2.12,<3", "httpx==0.28.1", "PyYAML>=6.0.2,<7",
  "Pillow>=12,<14", "portalocker>=3.2,<5", "rfc8785==0.1.4",
]

[project.scripts]
metasocli-py = "metasocli_py.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "hypothesis>=6.140,<7",
       "ruff>=0.14,<1", "mypy>=1.18,<2", "types-PyYAML>=6.0.12", "psutil>=7,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/metasocli_py"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/tests", "/skills", "/docs", "/README.md", "/AGENTS.md", "/uv.lock", "/uv.toml", "/pyproject.toml", "/.python-version"]
exclude = ["/.baseline", "/.work", "/.venv", "**/__pycache__", "/docs/ARTIFACTS.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --basetemp=.work/pytest"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 110
exclude = [".baseline", ".work", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

